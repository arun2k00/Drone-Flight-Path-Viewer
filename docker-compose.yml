services:
  app:
    build: .
    image: aeroxpress:local
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MAX_VIDEO_SIZE_MB: "4096"
      MAX_SRT_SIZE_MB: "50"
      ENABLE_DIAGNOSTICS: "true"
      NEXT_PUBLIC_MAP_STYLE_URL: ""
      # Public URL used in emails and share links (https:// in production makes cookies Secure).
      APP_URL: "http://localhost:3000"
      ADMIN_EMAIL: ""
      # Empty SMTP_HOST = emails saved to /app/storage/outbox
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASS: ""
      MAIL_FROM: "Aeroxpress <no-reply@example.com>"
    volumes:
      - dts-storage:/app/storage
    restart: unless-stopped
volumes:
  dts-storage:
